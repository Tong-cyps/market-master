function randn(){

/** Theme momentum: decay + noise each tick so hot/cold stay readable without direction-lock. */
function tickSectorMomentum(){
  sectorList.forEach(function(sec){
    var target = (themeMomTarget[sec] !== undefined) ? themeMomTarget[sec] : 0;
    var m = sectorMomentum[sec] || 0;
    m = m * 0.82 + target * 0.18 + randn() * 0.00014;
    if(m > 0.00032) m = 0.00032;
    if(m < -0.00032) m = -0.00032;
    sectorMomentum[sec] = m;
  });
}
/** Path schema migration / fresh hist: rebuild candles with current stepStock dynamics. */
function regeneratePathHist(){
  var savedClock = clockSeconds;
  stocks.forEach(function(s){
    s.hist = [];
    s.trend = 0;
    s.shortMean = s.price;
    s.signStreak = 0;
  });
  var _dv = DIFF_VOL, _dt = DIFF_TREND, _mv = marketVol;
  // Seed with current (v2) dynamics at mild amp so chart is usable immediately
  DIFF_VOL = Math.min(DIFF_VOL, 1.5);
  DIFF_TREND = Math.min(DIFF_TREND, 1.0);
  marketVol = 1.05;
  for(var i=0;i<INIT_HIST;i++){
    clockSeconds = savedClock - INIT_HIST + i;
    tickSectorMomentum();
    marketDev = marketIndex()/1000 - 1;
    stocks.forEach(function(s){ stepStock(s, 0); });
  }
  DIFF_VOL = _dv; DIFF_TREND = _dt; marketVol = _mv;
  clockSeconds = savedClock;
  rebuildIndexHist();
}
function stepStock(s, shock){
  if(s.sector==='指数') return;
  var oldP = s.price;
  s.trend = s.trend * 0.90 + (s.trendVol || 0) * DIFF_TREND * randn(); // was 0.94 — faster flip
  s.shortMean = s.shortMean * 0.996 + s.price * 0.004;
  var meanRev = ((s.shortMean - s.price) / s.price) * s.meanRev;
  var baseRev = ((s.basePrice - s.price) / s.price) * 0.0007;
  var beginner = equityHist.length < 25;
  // Knife3 hook: +sentimentDrift (subtle). Theme bias arrives via noisy sectorMomentum (not a sticky addend).
  var ret = s.drift + ((s.trend + meanRev*modeMeanRev + s.vol*DIFF_VOL*randn()) * marketVol * (beginner?0.88:1)) + baseRev + modeDrift + sentimentDrift + (sectorMomentum[s.sector]||0) + (shock||0) - marketDev * 0.0009;
  // Hard fade after 4 same-sign 1s returns — kills marathon one-way ticks
  if(typeof s.signStreak !== 'number') s.signStreak = 0;
  if(ret > 0){ s.signStreak = s.signStreak > 0 ? s.signStreak + 1 : 1; }
  else if(ret < 0){ s.signStreak = s.signStreak < 0 ? s.signStreak - 1 : -1; }
  else { s.signStreak = 0; }
  if(Math.abs(s.signStreak) >= 4){
    ret -= (s.signStreak > 0 ? 1 : -1) * (0.0012 + Math.random()*0.0018);
    s.trend *= 0.35;
    s.signStreak = 0;
  }
  var newP = Math.max(0.5, oldP*(1+ret));
  s.price = newP;
  var v = Math.round((200 + Math.random()*1200) * (1 + Math.abs(ret)*40));
  // 1s hist = ticks (last price); higher TFs aggregate real OHLC from the path
  s.hist.push({o:newP, h:newP, l:newP, c:newP, v:v, ts:clockSeconds});
  if(s.hist.length > HIST_CAP){ s.hist.shift(); }
}
function addLong(id, qty, price, lev){
  var h = holdings[id];
  var L = lev || 1;
  var before = h.long;
  h.long = before + qty;
  h.longEntry = (before*h.longEntry + qty*price) / h.long;
  h.longMargin += qty*price/L;
}
function addShort(id, qty, price, lev){
  var h = holdings[id];
  var L = lev || 1;
  var before = h.short;
  h.short = before + qty;
  h.shortEntry = (before*h.shortEntry + qty*price) / h.short;
  h.shortMargin += qty*price/L;
}
function closeLong(id, qty, price){
  var h = holdings[id];
  var before = h.long;
  if(before < qty) return false;
  var released = h.longMargin * (qty/before);
  var pl = (price - h.longEntry) * qty;
  realized.push(pl);
  if(pl > 0){ achv.wins++; var earned = Math.floor(pl * POINTS_PER_DOLLAR); points += earned; }
  tradeLog.unshift({t:clockStr(), n:getStock(id).name, side:'long', qty:qty, entry:h.longEntry, exit:price, pl:pl});
  if(tradeLog.length>50) tradeLog.pop();
  cash += released + pl;
  h.long = before - qty;
  h.longMargin -= released;
  if(h.long===0){ h.longEntry = 0; h.longMargin = 0; }
  return true;
}
function closeShort(id, qty, price){
  var h = holdings[id];
  var before = h.short;
  if(before < qty) return false;
  var released = h.shortMargin * (qty/before);
  var pl = (h.shortEntry - price) * qty;
  realized.push(pl);
  if(pl > 0){ achv.wins++; achv.shortWin = true; var earned2 = Math.floor(pl * POINTS_PER_DOLLAR); points += earned2; }
  tradeLog.unshift({t:clockStr(), n:getStock(id).name, side:'short', qty:qty, entry:h.shortEntry, exit:price, pl:pl});
  if(tradeLog.length>50) tradeLog.pop();
  cash += released + pl;
  h.short = before - qty;
  h.shortMargin -= released;
  if(h.short===0){ h.shortEntry = 0; h.shortMargin = 0; }
  return true;
}
function triggerEarnings(s){
  var surprise = randn()*0.055;
  var good = surprise>=0;
  var oldP = s.price;
  var newP = Math.max(0.5, oldP*(1+surprise));
  s.price = newP;
  s.hist.push({o:newP, h:newP, l:newP, c:newP, v:Math.round((1500+Math.random()*3000)*(1+Math.abs(surprise)*20)), ts:clockSeconds});
  if(s.hist.length > HIST_CAP){ s.hist.shift(); }
  news.unshift({time:clockStr(), text: s.name + (good ? ' 财报超预期 +' : ' 财报不及预期 ')+fmt(Math.abs(surprise)*100,1)+'%', textEn: s.name + (good ? ' earnings beat +' : ' earnings missed ')+fmt(Math.abs(surprise)*100,1)+'%', good:good});
  if(news.length>8) news.pop();

}
function payDividends(){
  var total = 0;
  stocks.forEach(function(s){
    if(s.divYield>0 && s.price>0){
      var d = s.price * s.divYield / 4;
      var h = holdings[s.id];
      if(h.long>0){ var got = h.long*d; cash += got; total += got; }
      if(h.short>0){ var paid = h.short*d; cash -= paid; total -= paid; }
      var oldP = s.price;
      var newP = Math.max(0.5, oldP - d);
      s.price = newP;
      s.hist.push({o:newP, h:newP, l:newP, c:newP, v:Math.round(400+Math.random()*600), ts:clockSeconds});
      if(s.hist.length > HIST_CAP){ s.hist.shift(); }
    }
  });
  if(total!==0){
    if(total>0) achv.div = true;
    var divTxt = total>=0 ? ('分红到账 $'+fmt(total)) : ('空头股息支出 $'+fmt(-total));
    var divEn = total>=0 ? ('Dividend received $'+fmt(total)) : ('Short dividend paid $'+fmt(-total));
    news.unshift({time:clockStr(), text:divTxt, textEn:divEn, good:total>=0});
    if(news.length>8) news.pop();
  }
}

function gameDayIndex(){ return Math.floor((clockSeconds - SESSION_OPEN) / SECONDS_PER_DAY); }
function getDayTheme(){
  for(var i=0;i<DAY_THEMES.length;i++){ if(DAY_THEMES[i].id===dayThemeId) return DAY_THEMES[i]; }
  return null;

function applyDayThemeBias(){
  var th = getDayTheme();
  if(!th) return;
  // Soft expected edge only — actual sectorMomentum is mean-reverting+noisy each tick (see tickSectorMomentum)
  var bias = Math.min(0.0001, th.bias || 0.0001);
  themeMomTarget = {};
  (th.hot||[]).forEach(function(sec){
    if(sectorList.indexOf(sec)<0) return;
    themeMomTarget[sec] = bias;
    sectorMomentum[sec] = bias * (0.4 + Math.random()*0.6);
  });
  (th.cold||[]).forEach(function(sec){
    if(sectorList.indexOf(sec)<0) return;
    themeMomTarget[sec] = -bias;
    sectorMomentum[sec] = -bias * (0.4 + Math.random()*0.6);
  });
  // Non-theme sectors gently revert toward 0
  sectorList.forEach(function(sec){
    if(themeMomTarget[sec] === undefined) themeMomTarget[sec] = 0;
  });
}
/** Knife 2: only 3–5 theme sectors are tradeable. */
function themePlaySectors(){
  var th = getDayTheme();
  if(!th) return [];
  var play = [];
  function add(sec){
    if(!sec || play.indexOf(sec)>=0) return;
    if(sectorList.indexOf(sec)<0) return;
    if(sec==='指数') return;
    play.push(sec);
  }
  (th.hot||[]).forEach(add);
  if(play.length < 3){
    (th.cold||[]).forEach(function(sec){ if(play.length < 3) add(sec); });
  }
  if(play.length < 3){
    sectorList.forEach(function(sec){
      if(play.length >= 3) return;
      if(isAssetSector(sec)) return;
      add(sec);
    });
  }
  if(play.length > 5) play = play.slice(0, 5);
  return play;
}
function isThemeTradeSector(sec){
  if(sec==='指数') return false;
  return themePlaySectors().indexOf(sec) >= 0;
}

function pickDayTheme(force){
  var d = gameDayIndex();
  if(!force && dayThemeId && dayThemeDay === d) { applyDayThemeBias(); syncThemeSectorUI(); return false; }
  var pool = DAY_THEMES.slice();
  if(dayThemeId){
    pool = pool.filter(function(th){ return th.id !== dayThemeId; });
    if(!pool.length) pool = DAY_THEMES.slice();
  }
  var th = pool[Math.floor(Math.random()*pool.length)];

  syncThemeSectorUI();

/** Knife 3: update fear/greed from recent news; mild mean-revert to 50; set sentimentDrift. */
function updateSentimentFromNews(){
  var recent = news.slice(0, 6);
  var newsPull = 50;
  if(recent.length){
    var wsum = 0, vsum = 0;
    for(var i=0;i<recent.length;i++){
      var w = 1 - i * 0.12;
      wsum += w;
      vsum += (recent[i].good ? 1 : -1) * w;
    }
    var avg = vsum / (wsum || 1); // ~-1..1
    newsPull = 50 + avg * 32;
  }
  sentiment += (newsPull - sentiment) * 0.14;
  sentiment += (50 - sentiment) * 0.035; // mild mean-revert
  if(sentiment < 0) sentiment = 0;
  if(sentiment > 100) sentiment = 100;
  // Subtle tilt into stepStock (max |drift| ≈ 0.00006, below modeDrift bull/bear)
  sentimentDrift = ((sentiment - 50) / 50) * 0.00006;
}

function resetIndexDayBaseline(){

  if(indexDayKey >= 0){

function tick(){
  clockSeconds++;
  if(resetIndexDayBaseline()){
    news.unshift({time:clockStr(), text:'新交易日开盘，大盘涨跌幅已重置', textEn:'New session: index day change reset', good:true});
    if(news.length>8) news.pop();
  }
  marketVol = marketVol + (1.45 - marketVol) * 0.00025 + 0.0011 * randn();
  if(Math.random() < 0.009){
    marketVol = Math.min(3.8, marketVol * (1.5 + Math.random()*1.1));
    news.unshift({time:clockStr(), text:'市场波动骤升！K线剧烈震荡', textEn:'Volatility spike — charts going extreme', good:false});
    if(news.length>8) news.pop();
  }
  marketVol = Math.max(1.0, Math.min(3.8, marketVol));
  marketDev = marketIndex()/1000 - 1;
  var shock = 0;
  var shockSector = null;
  if(Math.random() < 0.07){
    var good = Math.random() < 0.46;
    shock = (good?1:-1)*(0.006+Math.random()*0.018);
    var n = makeNews(shock);
    news.unshift(n);
    if(news.length>8) news.pop();
    newsSectors[n.sector] = clockSeconds;
    shockSector = n.sector;
  }
  // Occasional extreme single-name candle (gap)
  if(extremeCool>0) extremeCool--;
  if(extremeCool<=0 && Math.random() < 0.016){
    var pool = stocks.filter(function(x){ return x.sector!=='指数' && !isAssetSector(x.sector); });
    if(pool.length){
      var gs = pool[Math.floor(Math.random()*pool.length)];
      // Sometimes a whole-sector storm; else single-name extreme candle
      var sectorStorm = Math.random() < 0.28;
      var gapMag = 0.06 + Math.random()*0.14; // 6%–20%
      if(Math.random() < 0.12) gapMag = 0.18 + Math.random()*0.17; // rare 18%–35% nuke/moon
      var gap = (Math.random()<0.48?1:-1)*gapMag;
      function applyExtreme(s, g){
        var o = s.price;
        var n = Math.max(0.5, o*(1+g));
        s.price = n;
        s.trend += g * 0.08; // was 0.22 — avoid locking one-way after gaps
        s.hist.push({o:o, h:Math.max(o,n), l:Math.min(o,n), c:n, v:Math.round(5000+Math.random()*12000), ts:clockSeconds});
        if(s.hist.length>HIST_CAP) s.hist.shift();
      }
      if(sectorStorm){
        var sec = gs.sector;
        stocks.forEach(function(s){
          if(s.sector!==sec) return;
          var g2 = gap * (0.55 + Math.random()*0.7);
          applyExtreme(s, g2);
        });
        news.unshift({time:clockStr(), text: sec+(gap>0?' 板块极端拉升':' 板块极端跳水')+' ~'+fmt(Math.abs(gap)*100,0)+'%', textEn: sec+(gap>0?' sector spike ~':' sector dump ~')+fmt(Math.abs(gap)*100,0)+'%', good:gap>0});
      } else {
        applyExtreme(gs, gap);
        news.unshift({time:clockStr(), text: gs.name+(gap>0?' 极端拉升 +':' 极端跳水 ')+fmt(Math.abs(gap)*100,1)+'%', textEn: gs.name+(gap>0?' extreme spike +':' extreme dump ')+fmt(Math.abs(gap)*100,1)+'%', good:gap>0});
      }
      if(news.length>8) news.pop();
      extremeCool = 12 + Math.floor(Math.random()*28);
    }
  }
  updateSentimentFromNews();
    tickSectorMomentum();
  stocks.forEach(function(s){
    var sh = shock;
    if(shockSector && s.sector === shockSector) sh = shock * 3.0;
    stepStock(s, sh);
  });
  if(marketMode==='crash1929' && !crashDone){
    crashTimer++;
    if(crashTimer >= 90){
      crashDone = true;
      stocks.forEach(function(s){
        if(s.sector==='指数') return;
        var drop = 0.18 + Math.random()*0.22;
        var oldP = s.price; var newP = Math.max(0.5, s.price*(1-drop));
        s.price = newP;
        s.hist.push({o:newP,h:newP,l:newP,c:newP,v:Math.round(3000+Math.random()*5000),ts:clockSeconds});
        if(s.hist.length>HIST_CAP) s.hist.shift();
      });
      news.unshift({time:clockStr(), text:'1929 股灾！市场全面崩盘', textEn:'1929 Crash! Market collapse', good:false});
      if(news.length>8) news.pop();
    }
  }
  stocks.forEach(function(s){
    s.nextEarnings--;
    if(s.nextEarnings<=0){ triggerEarnings(s); }
  });
  divTimer--;
  if(divTimer<=0){ payDividends(); divTimer = DIV_TICKS; }
  syncIndexBar();
  rotateTimer--;
  if(rotateTimer<=0){ rotateSectors(); rotateTimer = ROTATE_TICKS; }
  for(var oi=optPositions.length-1; oi>=0; oi--){
    var op = optPositions[oi];
    op.timeLeft--;
    if(op.timeLeft<=0){
      var os = getStock(op.ticker);
      var payoff = (op.type==='call' ? Math.max(0, os.price-op.strike) : Math.max(0, op.strike-os.price)) * op.qty;
      cash += payoff;
      news.unshift({time:clockStr(), text: op.name+(op.type==='call'?' 看涨期权':' 看跌期权')+'到期，结算 $'+fmt(payoff), textEn: op.name+(op.type==='call'?' call expired':' put expired')+', settled $'+fmt(payoff), good: payoff>=op.premium});
      if(news.length>8) news.pop();
      optPositions.splice(oi,1);
    }
  }
  checkLiquidation();
  var _eq = totalAssets();
  equityHist.push(_eq);
  if(equityHist.length > 600) equityHist.shift();
  trackDayEquity(_eq);
  saveTimer++;
  if(saveTimer>=10){ saveTimer=0; saveGame(); }
  render();
}

function totalAssets(){
  var t = cash + frozenCash;
  stocks.forEach(function(s){
    var h = holdings[s.id];
    t += h.longMargin + (s.price - h.longEntry)*h.long;
    t += h.shortMargin + (h.shortEntry - s.price)*h.short;
  });
  optPositions.forEach(function(op){
    var os = getStock(op.ticker);
    if(!os) return;
    var intrinsic = (op.type==='call' ? Math.max(0, os.price-op.strike) : Math.max(0, op.strike-os.price)) * op.qty;
    t += intrinsic;
  });
  return t;
}
function marketIndex(){

  stocks.forEach(function(s){

    sum += s.price / s.basePrice;

  });
  return n>0 ? (sum / n) * 1000 : 1000;
}
function rebuildIndexHist(){
  var idx = null;
  stocks.forEach(function(s){ if(s.sector==='指数') idx = s; });
  if(!idx) return;
  var maps = [];
  var tsSet = {};
  stocks.forEach(function(s){
    if(isAssetSector(s.sector)) return;
    var m = {};
    s.hist.forEach(function(t){
      tsSet[t.ts] = 1;
      var e = m[t.ts];
      if(!e) m[t.ts] = {o:t.o, h:t.h, l:t.l, c:t.c, v:t.v};
      else { e.h = Math.max(e.h, t.h); e.l = Math.min(e.l, t.l); e.c = t.c; e.v += t.v; }
    });
    maps.push({s:s, m:m});
  });
  var tss = Object.keys(tsSet).map(Number).sort(function(a,b){ return a-b; });
  idx.hist = [];
  for(var i=0;i<tss.length;i++){
    var ts = tss[i], sumC=0, sumV=0, n=0;
    for(var j=0;j<maps.length;j++){
      var b = maps[j].m[ts];
      if(!b) continue;
      var bp = maps[j].s.basePrice;
      sumC += b.c/bp; sumV += b.v; n++;
    }
    if(!n) continue;
    var c=(sumC/n)*1000;
    var prev = idx.hist.length ? idx.hist[idx.hist.length-1].c : c;
    idx.hist.push({o:prev, h:Math.max(prev,c), l:Math.min(prev,c), c:c, v:sumV, ts:ts});
  }
  if(idx.hist.length > HIST_CAP) idx.hist = idx.hist.slice(-HIST_CAP);
  idx.price = idx.hist.length ? idx.hist[idx.hist.length-1].c : marketIndex();
}
function syncIndexBar(){
  stocks.forEach(function(s){
    if(s.sector!=='指数') return;
    var ip = marketIndex();
    var vol = 0;
    stocks.forEach(function(x){
      if(isAssetSector(x.sector)) return;
      for(var i=x.hist.length-1;i>=0;i--){
        var t = x.hist[i];
        if(t.ts !== clockSeconds) break;
        vol += t.v;
      }
    });
    // Index path: open=prev index, H/L from path to ip (not constituent wicks)
    var prev = s.price;
    if(s.hist.length && s.hist[s.hist.length-1].ts === clockSeconds){
      var last = s.hist[s.hist.length-1];
      last.h = Math.max(last.h, ip);
      last.l = Math.min(last.l, ip);
      last.c = ip;
      last.v = vol;
    } else {
      s.hist.push({o:prev, h:Math.max(prev,ip), l:Math.min(prev,ip), c:ip, v:vol, ts:clockSeconds});
      if(s.hist.length > HIST_CAP) s.hist.shift();
    }
    s.price = ip;
  });
}

        + '<span class="'+ocls+'">$'+fmt(est)+'</span></div>';
    });

  $('optList').innerHTML = oHtml;

}
function getCandles(s){
  var tf = { '1s':1, '5s':5, '1m':60, '5m':300, '15m':900, '30m':1800, '1h':3600 }[timeframeKey] || 1;
  var data = s.hist;
  var candles = [];
  var i = 0;
  while(i < data.length){
    var g = Math.floor(data[i].ts / tf);
    // Bucket OHLC from the traded path; open = first print (tick .o/.c)
    var o = data[i].o, hh = data[i].c, ll = data[i].c, vv = 0, c = data[i].c;
    if(data[i].h > hh) hh = data[i].h;
    if(data[i].l < ll) ll = data[i].l;
    while(i < data.length && Math.floor(data[i].ts / tf) === g){
      var t = data[i];
      var pc = t.c;
      if(pc > hh) hh = pc;
      if(pc < ll) ll = pc;
      if(t.h > hh) hh = t.h;
      if(t.l < ll) ll = t.l;
      vv += t.v;
      c = pc;
      i++;
    }
    candles.push({o:o, h:hh, l:ll, c:c, v:vv});
  }
  return candles.slice(-60);
}
function drawChart(){
  var c = $('chart');
  if(!c) return;
  var w = c.clientWidth || 320;
  var h = c.clientHeight || 240;
  var dpr = window.devicePixelRatio || 1;
  c.width = w*dpr; c.height = h*dpr;
  var ctx = c.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  var s = getStock(selected);
  var candles = getCandles(s);
  if(candles.length<1) return;
  var axisW = 52;
  var macdH = showIndicators ? Math.floor(h*0.15) : 0;
  var volH = Math.floor(h*0.18);
  var priceH = h - volH - macdH;
  var pad = 6;
  var plotR = w - axisW;
  var closes = [];
  candles.forEach(function(cd){ closes.push(cd.c); });
  function smaSeries(data, n){
    var out = [], sum = 0;
    for(var i=0;i<data.length;i++){
      sum += data[i];
      if(i >= n) sum -= data[i-n];
      out.push(i >= n-1 ? sum/n : null);
    }
    return out;
  }
  function emaSeries(data, n){
    var out = [], k = 2/(n+1), prev = data[0];
    for(var i=0;i<data.length;i++){
      prev = (i===0) ? data[0] : data[i]*k + prev*(1-k);
      out.push(prev);
    }
    return out;
  }
  var ma5 = smaSeries(closes, 5);
  var ma10 = smaSeries(closes, 10);
  var ma20 = smaSeries(closes, 20);
  var bollUp = [], bollLo = [];
  for(var bi=0;bi<closes.length;bi++){
    if(ma20[bi]===null){ bollUp.push(null); bollLo.push(null); continue; }
    var ss = 0;
    for(var bj=bi-19;bj<=bi;bj++){ var dv = closes[bj]-ma20[bi]; ss += dv*dv; }
    var sd = Math.sqrt(ss/20);
    bollUp.push(ma20[bi]+2*sd);
    bollLo.push(ma20[bi]-2*sd);
  }
  var ema12 = emaSeries(closes, 12);
  var ema26 = emaSeries(closes, 26);
  var dif = [], dea = [], hist = [];
  var difArr = [];
  for(var mi=0;mi<closes.length;mi++){ difArr.push(ema12[mi]-ema26[mi]); }
  var deaArr = emaSeries(difArr, 9);
  for(var mi=0;mi<closes.length;mi++){
    dif.push(difArr[mi]);
    dea.push(deaArr[mi]);
    hist.push((difArr[mi]-deaArr[mi])*2);
  }
  var min = Infinity, max = -Infinity, maxV = 0;
  candles.forEach(function(cd){ if(cd.l<min)min=cd.l; if(cd.h>max)max=cd.h; if(cd.v>maxV)maxV=cd.v; });
  if(showIndicators){
    [ma5,ma10,ma20,bollUp,bollLo].forEach(function(arr){
      arr.forEach(function(v){ if(v!==null){ if(v<min)min=v; if(v>max)max=v; } });
    });
  }
  if(max-min < 0.0001){ min-=1; max+=1; }
  if(maxV<=0) maxV = 1;
  function py(p){ return pad + (max-p)/(max-min)*(priceH-pad*2); }
  function priceAt(y){ return max - (y-pad)/(priceH-pad*2)*(max-min); }
  var cw = (plotR - pad) / candles.length;
  var bodyW = Math.max(4, cw * 0.7);
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for(var gi=0;gi<=4;gi++){
    var gy = pad + (priceH-pad*2)*gi/4;
    ctx.beginPath(); ctx.moveTo(pad,gy); ctx.lineTo(plotR,gy); ctx.stroke();
    ctx.fillStyle = '#8b93a7';
    ctx.fillText(fmt(max-(max-min)*gi/4,2), plotR+4, gy);
  }
  if(showIndicators){
    ctx.fillStyle = 'rgba(168,85,247,0.06)';
    ctx.beginPath();
    var st = false;
    for(var i=0;i<candles.length;i++){
      if(bollUp[i]===null) continue;
      var bx = pad + i*cw + cw/2;
      var byU = py(bollUp[i]);
      if(!st){ ctx.moveTo(bx, byU); st=true; } else { ctx.lineTo(bx, byU); }
    }
    for(var i=candles.length-1;i>=0;i--){
      if(bollLo[i]===null) continue;
      var bx = pad + i*cw + cw/2;
      var byL = py(bollLo[i]);
      ctx.lineTo(bx, byL);
    }
    ctx.closePath();
    ctx.fill();
  }
  // Single TF (5s): always OHLC candlesticks
  candles.forEach(function(cd, idx){
    var cx = pad + idx*cw + cw/2;
    var up = cd.c >= cd.o;
    var color = up ? '#22c55e' : '#ef4444';
    var yH = py(cd.h), yL = py(cd.l);
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.25;
    ctx.beginPath(); ctx.moveTo(cx,yH); ctx.lineTo(cx,yL); ctx.stroke();
    var yO = py(cd.o), yC = py(cd.c);
    var top = Math.min(yO,yC);
    var bh = Math.max(2, Math.abs(yO-yC));
    ctx.fillStyle = color;
    ctx.fillRect(cx-bodyW/2, top, Math.max(bodyW, 3), bh);
    var vh = (volH-6) * (cd.v/maxV);
    ctx.fillStyle = up ? 'rgba(34,197,94,0.5)' : 'rgba(239,68,68,0.5)';
    ctx.fillRect(cx-bodyW/2, priceH+volH-4-vh, Math.max(bodyW, 3), vh);
  });
  function drawSeries(arr, color, yFn, dash){
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.4;
    ctx.setLineDash(dash ? [3,3] : []);
    ctx.beginPath();
    var started = false;
    for(var i=0;i<arr.length;i++){
      if(arr[i]===null){ started=false; continue; }
      var x = pad + i*cw + cw/2;
      var y = yFn(arr[i]);
      if(!started){ ctx.moveTo(x,y); started=true; } else { ctx.lineTo(x,y); }
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }
  if(showIndicators){
    drawSeries(ma5, '#f59e0b', py, false);
    drawSeries(ma10, '#3b82f6', py, false);
    drawSeries(ma20, '#a855f7', py, false);
    drawSeries(bollUp, 'rgba(168,85,247,0.7)', py, true);
    drawSeries(bollLo, 'rgba(168,85,247,0.7)', py, true);
  }
  ctx.strokeStyle = 'rgba(148,163,184,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(pad, priceH); ctx.lineTo(plotR, priceH); ctx.stroke();
  ctx.fillStyle = '#8b93a7';
  ctx.fillText('VOL', pad, priceH+11);
  if(showIndicators){
    var macdTop = priceH + volH;
    ctx.strokeStyle = 'rgba(148,163,184,0.25)';
    ctx.beginPath(); ctx.moveTo(pad, macdTop); ctx.lineTo(plotR, macdTop); ctx.stroke();
    ctx.fillStyle = '#8b93a7';
    ctx.fillText('MACD', pad, macdTop+11);
    var macdMax = 0;
    for(var i=0;i<hist.length;i++){
      if(Math.abs(hist[i])>macdMax) macdMax=Math.abs(hist[i]);
      if(Math.abs(dif[i])>macdMax) macdMax=Math.abs(dif[i]);
      if(Math.abs(dea[i])>macdMax) macdMax=Math.abs(dea[i]);
    }
    if(macdMax<=0) macdMax = 1;
    function macdY(v){ return macdTop + 6 + (macdH-12)/2 - (v/macdMax)*((macdH-12)/2); }
    var zeroY = macdY(0);
    ctx.strokeStyle = 'rgba(148,163,184,0.3)';
    ctx.beginPath(); ctx.moveTo(pad, zeroY); ctx.lineTo(plotR, zeroY); ctx.stroke();
    for(var i=0;i<hist.length;i++){
      var mx = pad + i*cw + cw/2;
      var my = macdY(hist[i]);
      var bh2 = Math.abs(zeroY-my);
      if(bh2<0.5) bh2=0.5;
      ctx.fillStyle = hist[i]>=0 ? 'rgba(34,197,94,0.6)' : 'rgba(239,68,68,0.6)';
      ctx.fillRect(mx-bodyW/2, Math.min(my,zeroY), bodyW, bh2);
    }
    drawSeries(dif, '#f59e0b', macdY, false);
    drawSeries(dea, '#3b82f6', macdY, false);
  }
  var last = candles[candles.length-1];
  var lcColor = last.c >= last.o ? '#22c55e' : '#ef4444';
  var ly = py(last.c);
  ctx.strokeStyle = lcColor;
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(pad, ly); ctx.lineTo(plotR, ly); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = lcColor;
  ctx.fillRect(plotR+1, ly-8, axisW-2, 16);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(fmt(last.c,2), plotR+5, ly+1);
  if(cross && cross.x>=pad && cross.x<=plotR && cross.y>=pad && cross.y<=priceH){
    var idx = Math.floor((cross.x - pad)/cw);
    idx = Math.max(0, Math.min(candles.length-1, idx));
    var cd = candles[idx];
    var cx2 = pad + idx*cw + cw/2;
    var cyy = Math.max(pad, Math.min(priceH-pad, cross.y));
    ctx.strokeStyle = 'rgba(148,163,184,0.55)';
    ctx.setLineDash([2,2]);
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx2, 0); ctx.lineTo(cx2, priceH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad, cyy); ctx.lineTo(plotR, cyy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#3b82f6';
    ctx.fillRect(plotR+1, cyy-8, axisW-2, 16);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(fmt(priceAt(cyy),2), plotR+5, cyy+1);
    var chg = cd.c - cd.o;
    var base = cd.o;
    var chgPct = base>0 ? chg/base*100 : 0;
    var tip = '开 '+fmt(cd.o,2)+'  高 '+fmt(cd.h,2)+'  低 '+fmt(cd.l,2)+'  收 '+fmt(cd.c,2);
    var tip2 = (chg>=0?'+':'')+fmt(chg,2)+' ('+fmt(chgPct,2)+'%)';
    var tw = Math.max(ctx.measureText(tip).width, ctx.measureText(tip2).width) + 16;
    ctx.fillStyle = 'rgba(15,23,42,0.92)';
    ctx.fillRect(8, 8, tw, 30);
    ctx.fillStyle = '#e5e7eb';
    ctx.fillText(tip, 16, 17);
    ctx.fillStyle = chg>=0 ? '#22c55e' : '#ef4444';
    ctx.fillText(tip2, 16, 30);
  }
  if(showIndicators){
    var li = candles.length-1;
    var m5 = ma5[li], m10 = ma10[li], m20 = ma20[li], bu = bollUp[li], bl = bollLo[li];
    $('indicator').innerHTML = 'MA5 <span class="i-ma5">'+(m5===null?'—':fmt(m5))+'</span>  MA10 <span class="i-ma10">'+(m10===null?'—':fmt(m10))+'</span>  MA20 <span class="i-ma20">'+(m20===null?'—':fmt(m20))+'</span>  BOLL '+(bl===null?'—':fmt(bl))+'~'+(bu===null?'—':fmt(bu))+'  MACD '+fmt(hist[li],4);
  } else {
    $('indicator').innerHTML = '';
  }
}

function chartPos(e){
  var rect = $('chart').getBoundingClientRect();
  var x, y;
  if(e.touches && e.touches.length>0){ x = e.touches[0].clientX - rect.left; y = e.touches[0].clientY - rect.top; }
  else { x = e.clientX - rect.left; y = e.clientY - rect.top; }
  return {x:x, y:y};
}

function stockCardHtml(s){

function renderMarketHtml(){
  stocks.forEach(function(s){
    var prev = prevPrices[s.id];
    if(prev !== undefined && s.price !== prev){
      priceDir[s.id] = s.price > prev ? 'up' : 'down';
    } else {
      priceDir[s.id] = '';
    }
    prevPrices[s.id] = s.price;
  });
  var secOrder = [];
  var secMap = {};
  stocks.forEach(function(s){
    if(activeCategory !== '全部'){
      var inCat = false;
      for(var c=0; c<CATEGORIES.length; c++){
        if(CATEGORIES[c].key === activeCategory && CATEGORIES[c].sectors.indexOf(s.sector) >= 0){ inCat = true; break; }
      }
      if(!inCat) return;
    }
    if(!secMap[s.sector]){ secMap[s.sector] = []; secOrder.push(s.sector); }
    secMap[s.sector].push(s);
  });
  var html = '';
  var playSecs = themePlaySectors();
  secOrder.forEach(function(sec){
    var list = secMap[sec];
    var locked = SECTOR_UNLOCK[sec] && totalAssets() < SECTOR_UNLOCK[sec];
    var inPlay = playSecs.indexOf(sec) >= 0;
    var open = !locked && !!openSectors[sec];
    var sumPct = 0;
    list.forEach(function(s){
      var p = s.hist.length>1 ? s.hist[s.hist.length-2].c : s.price;
      sumPct += p>0 ? (s.price-p)/p*100 : 0;
    });
    var avgPct = sumPct/list.length;
    var cls = avgPct>=0?'up':'down';
    var chgTxt = locked
      ? '<span class="sec-lock">🔒 '+(LANG==='en'?'unlock $':'解锁$')+fmt(SECTOR_UNLOCK[sec],0)+'</span>'
      : '<span class="sec-chg '+cls+'">'+(avgPct>=0?'+':'')+fmt(avgPct,2)+'%</span>';
    var tag = locked ? '' : (inPlay
      ? '<span class="sec-tag-on">'+(LANG==='en'?'Theme':'主题')+'</span>'
      : '<span class="sec-tag-off">'+(LANG==='en'?'Folded':'非主题')+'</span>');
    html += '<div class="sec-head'+(inPlay||locked?'':' theme-dim')+'" onclick="toggleSec(\''+sec+'\')">'
      + '<span class="sec-name">'+sectName(sec)+(isInNews(sec)?' 📰':'')+tag+'</span>'
      + '<span class="sec-count">'+list.length+(LANG==='en'?'':'只')+'</span>'
      + chgTxt
      + '<span class="sec-arrow">'+(locked?'🔒':(open?'▾':'▸'))+'</span>'
      + '</div>';
    if(open){
      html += '<div class="sec-body'+(inPlay?'':' theme-dim')+'">';
      list.forEach(function(s){ html += stockCardHtml(s); });
      html += '</div>';
    }
  });
  return html;
}

function buyOption(){
  var s = getStock(selected);
  if(s.sector==='指数'){ toast(LANG==='en'?'Index is not tradable':'大盘指数不可交易'); return; }
  if(!isThemeTradeSector(s.sector)){ toast(t('theme_sector_only')); return; }
  var q = parseInt($('optQty').value,10);
  var k = parseFloat($('optStrike').value);
  if(!q || q<=0){ toast(t('enter_qty')); return; }
  if(!k || k<=0){ toast(t('enter_strike')); return; }
  var intr = optType==='call' ? Math.max(0, s.price-k) : Math.max(0, k-s.price);
  var premium = (intr + s.price*0.03)*q;
  if(premium > cash + 0.0001){ toast(t('insuff_funds')); return; }
  cash -= premium;
  optPositions.push({id:optId++, type:optType, ticker:s.id, name:s.name, strike:k, qty:q, premium:premium, timeLeft:optExp});
  toast(t('bought_option'));
  achv.option = true;
  achv.trades++;
  render();
}

function maxDrawdown(){
  var peak = START_CASH, maxDD = 0;
  for(var i=0;i<equityHist.length;i++){
    if(equityHist[i] > peak) peak = equityHist[i];
    var dd = (peak - equityHist[i]) / peak * 100;
    if(dd > maxDD) maxDD = dd;
  }
  return maxDD;
}
function drawEquity(){
  var cv = $('equityChart');
  if(!cv) return;
  var ctx = cv.getContext('2d');
  var w = cv.width, h = cv.height;
  ctx.clearRect(0,0,w,h);
  var data = equityHist;
  if(data.length < 2){
    ctx.fillStyle = '#8b93a7'; ctx.font='12px sans-serif'; ctx.textAlign='left';
    ctx.fillText('正在积累资产曲线…', 8, h/2);
    return;
  }
  var min = Infinity, max = -Infinity;
  data.forEach(function(v){ if(v<min)min=v; if(v>max)max=v; });
  if(max-min < 0.0001){ max += 1; min -= 1; }
  var pad = 4;
  var up = data[data.length-1] >= data[0];
  ctx.strokeStyle = up ? '#22c55e' : '#ef4444';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for(var i=0;i<data.length;i++){
    var x = i/(data.length-1)*(w-pad*2)+pad;
    var y = h-pad - (data[i]-min)/(max-min)*(h-pad*2);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(148,163,184,0.3)';
  ctx.lineWidth = 1;
  var yBase = h-pad - (START_CASH-min)/(max-min)*(h-pad*2);
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(pad, yBase); ctx.lineTo(w-pad, yBase); ctx.stroke();
  ctx.setLineDash([]);
}

    var h = holdings[s.id];
    if(h.long > 0 && (h.longEntry - s.price) * h.long >= h.longMargin){
      closeLong(s.id, h.long, s.price);
      if(tradeLog[0]) tradeLog[0].liq = true;

function nextPointItem(){

  avail.sort(function(a,b){ return a.price - b.price; });
  return avail[0] || null;
}

function buyWithPoints(id, type){
  var item = null;
  var list = type==='theme' ? POINT_THEMES : POINT_TITLES;
  list.forEach(function(s){ if(s.id===id) item = s; });
  if(!item || purchasedPoints[id]) return;
  if(points < item.price){ toast(LANG==='en'?'Not enough points':'积分不足'); return; }
  points -= item.price;
  purchasedPoints[id] = true;
  if(type==='theme'){ activeTheme = item.theme; applyTheme(); }
  if(type==='title'){ activeTitle = LANG==='en'?item.name[1]:item.name[0]; }
  toast('🎉 '+(LANG==='en'?'Acquired: ':'已获得：')+(LANG==='en'?item.name[1]:item.name[0]));
  saveGame();
  renderPointShop();
  render();
}

function updateDaily(){
  var key = String(gameDayIndex());
  if(!dayKey) dayKey = key;
  if(dayKey !== key){
    // Day roll normally handled in resetIndexDayBaseline (EOD modal); keep fallback sync
    dayKey = key;
    dayStartAssets = totalAssets();
    dayEquityPeak = dayStartAssets;
    dayMaxDD = 0;
    saveGame();
  }
  var daily = totalAssets() - dayStartAssets;
  var dpct = dayStartAssets > 0 ? daily/dayStartAssets*100 : 0;
  var elapsed = ((clockSeconds - SESSION_OPEN) % SECONDS_PER_DAY + SECONDS_PER_DAY) % SECONDS_PER_DAY;
  var left = SECONDS_PER_DAY - elapsed;
  var h = Math.floor(left/3600), m = Math.floor((left%3600)/60), s = left%60;
  $('brandDaily').innerHTML = '<span class="dl-label">'+(LANG==='en'?'Daily':'今日涨幅')+'</span> <span class="'+(daily>=0?'up':'down')+'">'+(daily>=0?'+':'')+'$'+fmt(daily)+' ('+(daily>=0?'+':'')+fmt(dpct,1)+'%)</span> <span class="dl-count">· '+(LANG==='en'?'reset in':'距结算')+' '+pad(h)+':'+pad(m)+':'+pad(s)+'</span>';
}

function normalizeHoldings(){
  stocks.forEach(function(s){
    var h = holdings[s.id];
    if(!h){
      holdings[s.id] = {long:0, longEntry:0, longMargin:0, short:0, shortEntry:0, shortMargin:0};
    } else {
      if(h.longAvg !== undefined){ h.longEntry = h.longAvg; delete h.longAvg; }
      if(h.shortAvg !== undefined){ h.shortEntry = h.shortAvg; delete h.shortAvg; }
      h.long = h.long || 0;
      h.longEntry = h.longEntry || 0;
      h.longMargin = h.longMargin || 0;
      h.short = h.short || 0;
      h.shortEntry = h.shortEntry || 0;
      h.shortMargin = h.shortMargin || 0;
    }
    if(!s.nextEarnings){
      s.nextEarnings = isAssetSector(s.sector) ? Infinity : 600 + Math.floor(Math.random()*1200);
    }
  });
}
function drawSpark(cv, s){
  var ctx = cv.getContext('2d');
  var w = cv.width, h = cv.height;
  ctx.clearRect(0,0,w,h);
  var data = [];
  for(var i=s.hist.length-1;i>=0 && data.length<40;i--){ data.unshift(s.hist[i].c); }
  if(data.length<2) return;
  var min=Infinity,max=-Infinity;
  data.forEach(function(v){ if(v<min)min=v; if(v>max)max=v; });
  if(max-min<0.0001){ max+=0.1; min-=0.1; }
  var up = data[data.length-1] >= data[0];
  ctx.strokeStyle = up ? '#22c55e' : '#ef4444';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  data.forEach(function(v,i){
    var x = i/(data.length-1)*(w-2)+1;
    var y = 1 + (max-v)/(max-min)*(h-2);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
}
